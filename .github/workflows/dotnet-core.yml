name: .NET Core

on:
  push:
    tags:
      - '*'
    branches:
      - develop
  pull_request:
    branches: [ master, develop, release/**, hotfix/** ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gitversion.outputs.semVer }}

    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0

    # Setup .Net SDKs
    - name: Setup .NET Core 3.1
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '3.1.x'
    - name: Setup .NET 6.0
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '6.0.x'
    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '8.0.x'

    # Perform the dotnet actions
    - name: Restore
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: Test
      run: |
        dotnet test --no-restore --configuration Release --framework netcoreapp3.1
        dotnet test --no-restore --configuration Release --framework net6.0
        dotnet test --no-restore --configuration Release --framework net8.0

    # Get the version information
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v0.9.7
      if: ${{ success() && contains(github.event_name, 'push') }}
      with:
        versionSpec: '5.x'
    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v0.9.7
      if: ${{ success() && contains(github.event_name, 'push') }}
      with:
        useConfigFile: true
    - name: Display SemVer
      if: ${{ success() && contains(github.event_name, 'push') }}
      run: |
        echo "SemVer: $GITVERSION_SEMVER"

  test-net48:
    name: Test (.NET Framework 4.8)
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: Test (net48)
      run: dotnet test --no-restore --configuration Release --framework net48

  publish:
    name: Package and Publish
    needs: [build, test-net48]
    runs-on: ubuntu-latest
    if: ${{ success() && contains(github.event_name, 'push') }}

    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: Package
      run: dotnet pack --no-build --configuration Release --output ./Packages -p:PackageVersion=${{ needs.build.outputs.semver }}
    - name: Push
      run: |
        cd Packages
        dotnet nuget push "*.nupkg" --source https://api.nuget.org/v3/index.json --api-key $NUGET_API_KEY
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
